name: Deploy YGO TYPE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'server.py'
      - 'jp-variants.js'
      - 'OPENCC-LICENSE.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html jp-variants.js OPENCC-LICENSE.txt _site/
          python3 server.py --build-index _site/card-names.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
